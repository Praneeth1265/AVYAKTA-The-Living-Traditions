name: CI Pipeline

on:
  pull_request:
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Setup Node
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '24'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install
        working-directory: ./frontend

      # 4. Lint check
      - name: Run lint
        run: npm run lint
        working-directory: ./frontend

      # 5. Prettier format check
      - name: Check formatting
        run: npx prettier --check .
        working-directory: ./frontend

      # 6. Unit tests (placeholder)
      - name: Run unit tests
        run: npm run test || echo "No unit tests yet"
        working-directory: ./frontend

      # 7. Build project
      - name: Build project
        run: npm run build
        working-directory: ./frontend

      # 8. Install Playwright browsers
      - name: Install Playwright
        run: npx playwright install --with-deps
        working-directory: ./frontend

      # 9. Start app (background)
      - name: Start app
        run: npm run dev &
        working-directory: ./frontend

      # 10. Wait for server to be ready
      - name: Wait for app
        run: npx wait-on http://localhost:5173
        working-directory: ./frontend

      # 11. Run E2E tests
      - name: Run E2E tests
        run: npx playwright test --reporter=github
        working-directory: ./frontend