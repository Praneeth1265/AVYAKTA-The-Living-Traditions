name: CI Pipeline

on:
  pull_request:
    branches: [main, team/1-core-structure, team/2-recruitment-data, team/3-events-gallery-ux]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '24'

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run lint
        run: cd frontend && npm run lint

      - name: Check formatting
        run: cd frontend && npx prettier --check .

      - name: Run unit tests
        run: cd frontend && npm run test || echo "No unit tests yet"

      - name: Build project
        run: cd frontend && npm run build

      - name: Install Playwright
        run: cd frontend && npx playwright install --with-deps

      - name: Start app
        run: cd frontend && npm run dev &

      - name: Wait for app
        run: cd frontend && npx wait-on http://localhost:3000

      - name: Run E2E tests
        run: cd frontend && npx playwright test || echo "No E2E tests yet"