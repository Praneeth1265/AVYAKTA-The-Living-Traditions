name: CI Pipeline

on:
  pull_request:
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '24' # Use 'lts/*' for latest LTS version

      - name: Install dependencies
        run: npm install
        working-directory: ./frontend
        
      - name: Run lint
        run: npm run lint
        working-directory: ./frontend

      - name: Build project
        run: npm run build
        working-directory: ./frontend