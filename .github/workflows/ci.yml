name: CI Pipeline

on:
  pull_request:
    branches: [main, dev, "team/**"]

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task: [typecheck, lint, format, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run ${{ matrix.task }}
        run: |
          cd frontend
          case ${{ matrix.task }} in
            typecheck) npx tsc --noEmit ;;
            lint)      npm run lint ;;
            format)    npx prettier --check . ;;
            test)      npm run test || echo "No tests yet" ;;
          esac

  build-and-e2e:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build project
        run: cd frontend && npm run build

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps

      - name: Start app
        run: cd frontend && npm run start &

      - name: Wait for app
        run: cd frontend && npx wait-on http://localhost:3000

      - name: Run E2E tests
        run: cd frontend && npx playwright test || echo "No E2E tests yet"